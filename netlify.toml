# Fonte de verdade da configuracao de build. A UI do Netlify serve apenas para
# segredos. Ver docs/01_AUDITORIA_DEPLOY_NETLIFY.md.

[build]
  # "validate" corre antes do build: se o conteudo estiver invalido o deploy
  # falha e o deploy anterior mantem-se em producao.
  command = "npm run validate && npm run build"

  # NAO REMOVER. ".next" e o publish directory documentado para o adaptador
  # Next.js da Netlify (a deteccao automatica de framework sugere exactamente
  # `next build` + `.next`).
  #
  # Tem de estar declarado AQUI e nao so na UI: este site foi criado para o
  # projeto Quasar e a UI tinha "dist/spa" gravado. Sem esta linha, o
  # netlify.toml nao sobrepoe esse valor obsoleto, o build passa e o deploy
  # falha com "Deploy directory 'dist/spa' does not exist".
  #
  # Nao usar "out": esse seria o output de `output: 'export'`, que este projeto
  # nao usa de proposito — quebraria o proxy de negociacao de idioma e a
  # optimizacao do next/image.
  publish = ".next"

  # SEM [[plugins]]: o adaptador e automatico e atualizado; fixa-lo e regressao.

[build.environment]
  NODE_VERSION = "22"
  # Nao e preciso NPM_FLAGS="--include=dev": a Netlify nao define NODE_ENV, logo
  # as devDependencies (typescript, tailwind) instalam-se por omissao.

# NOTA: nao ha NEXT_PUBLIC_SITE_URL. O URL canonico vive em content/site.json
# (site.url) — uma fonte de verdade so. Mudar de dominio e editar esse ficheiro.

[context.deploy-preview.environment]
  NEXT_PUBLIC_NOINDEX = "true"

[context.branch-deploy.environment]
  NEXT_PUBLIC_NOINDEX = "true"

# ---------------------------------------------------------------------------
# Headers. Nota: headers e redirects sao GLOBAIS — nao aceitam contexto.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Necessario: o `frame-ancestors` abaixo esta em Report-Only, logo NAO impoe
    # nada. Sem este cabecalho o site seria enquadravel hoje.
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # FASE 1: Report-Only durante ~1 mes. Ver as violacoes na consola do browser
    # e so depois renomear para Content-Security-Policy.
    #
    # frame-src  : iframes do YouTube e Vimeo, inseridos so DEPOIS de um clique
    # img-src    : NAO inclui i.ytimg.com nem i.vimeocdn.com de proposito — os
    #              posters sao auto-hospedados (zero origens terceiras no load).
    #              O Netlify Image CDN e same-origin (/.netlify/images).
    # script-src : quando a analitica for activada (content/site.json ->
    #              analytics.enabled), acrescentar https://plausible.io aqui E em
    #              connect-src, senao o script e bloqueado em silencio.
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self' https://*.vimeo.com https://*.youtube.com; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; upgrade-insecure-requests"

# ATENCAO: /media/* NAO tem hash no nome do ficheiro. `immutable` de um ano
# prenderia browsers e o Image CDN a imagem antiga durante um ano depois de a
# substituir — exactamente o passo que este projeto tem de facilitar.
# Um dia de cache, com revalidacao em segundo plano durante uma semana.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

